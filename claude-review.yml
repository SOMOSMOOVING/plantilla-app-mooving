# Revisión automática de código con Claude
# - En Pull Requests: deja comentarios en las líneas con problemas y un resumen en el PR.
# - En push directo a main/master: si encuentra algo Crítico, Alto o Medio, abre un issue.
# - Manual (pestaña Actions → "Run workflow"): revisa los últimos N commits.
# La rúbrica está en .github/claude-review.md (editala ahí, no acá).

name: Revisión de código (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "docs/**", ".github/claude-review.md"]
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md", "docs/**", ".github/claude-review.md"]
  workflow_dispatch:
    inputs:
      commits:
        description: "Cuántos commits hacia atrás revisar"
        required: false
        default: "10"

# En un PR, si subís otro cambio mientras corre, cancela la revisión vieja (la nueva revisa todo el PR).
# En push directo no cancela, para que ningún push quede sin revisar.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revision:
    # No revisa PRs en borrador ni PRs de Dependabot (no tienen acceso a los secrets).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar ruff
        run: pipx install ruff

      - name: Definir qué revisar
        id: alcance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          N_COMMITS: ${{ github.event.inputs.commits }}
        run: |
          set -euo pipefail
          ARBOL_VACIO=$(git hash-object -t tree /dev/null)
          SALTEAR=false

          if [ "$EVENTO" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"; MODO="pr"
          elif [ "$EVENTO" = "push" ]; then
            HEAD="$GITHUB_SHA"; BASE="$PUSH_BEFORE"; MODO="push"
            if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse --verify -q "${HEAD}~1^{commit}" || echo "$ARBOL_VACIO")
            fi
            # Si este push es el merge de un PR, ya se revisó en el PR: no repetir.
            PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls" --jq 'length' 2>/dev/null) || PRS=0
            if [[ "$PRS" =~ ^[1-9][0-9]*$ ]]; then SALTEAR=true; fi
          else
            HEAD="$GITHUB_SHA"; MODO="push"
            N="${N_COMMITS:-10}"
            BASE=$(git rev-parse --verify -q "${HEAD}~${N}^{commit}" || echo "$ARBOL_VACIO")
          fi

          ARCHIVOS=$(git diff --name-only "$BASE" "$HEAD" | wc -l)
          if [ "$ARCHIVOS" -eq 0 ]; then SALTEAR=true; fi

          echo "Modo: $MODO · Base: $BASE · Head: $HEAD · Archivos: $ARCHIVOS · Saltear: $SALTEAR"
          {
            echo "base=$BASE"
            echo "head=$HEAD"
            echo "modo=$MODO"
            echo "saltear=$SALTEAR"
          } >> "$GITHUB_OUTPUT"

      # ---------- Pull Requests: comentarios en el PR ----------
      - name: Revisar Pull Request
        if: steps.alcance.outputs.saltear == 'false' && steps.alcance.outputs.modo == 'pr'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            DIFF A REVISAR: `git diff ${{ steps.alcance.outputs.base }}...${{ steps.alcance.outputs.head }}`

            Sos un revisor de código. La rama del PR ya está en el directorio actual.
            1. Leé `.github/claude-review.md` y seguí esa rúbrica al pie de la letra.
            2. Hacé la Pasada A (correctitud y seguridad) y después la Pasada B (calidad), por separado.
            3. Verificá cada hallazgo antes de publicarlo; descartá los que no se sostengan.
            4. Para cada hallazgo Crítico, Alto o Medio, dejá un comentario en la línea exacta con
               `mcp__github_inline_comment__create_inline_comment` (con `confirmed: true`).
            5. Al final publicá UN solo comentario de resumen con `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
               con el formato de "Resumen final" de la rúbrica (incluí ahí también los hallazgos Bajos).
            Sólo publicá comentarios en GitHub. No modifiques archivos ni hagas commits.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ruff check:*)"

      # ---------- Push directo o manual: abre un issue si hay algo importante ----------
      - name: Revisar push
        if: steps.alcance.outputs.saltear == 'false' && steps.alcance.outputs.modo == 'push'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            RAMA: ${{ github.ref_name }}
            DIFF A REVISAR: `git diff ${{ steps.alcance.outputs.base }} ${{ steps.alcance.outputs.head }}`
            COMMITS: `git log --oneline ${{ steps.alcance.outputs.base }}..${{ steps.alcance.outputs.head }}`

            Sos un revisor de código. El código ya está en el directorio actual.
            1. Leé `.github/claude-review.md` y seguí esa rúbrica al pie de la letra.
            2. Hacé la Pasada A (correctitud y seguridad) y después la Pasada B (calidad), por separado.
            3. Verificá cada hallazgo antes de informarlo; descartá los que no se sostengan.
            4. Si hay al menos un hallazgo Crítico, Alto o Medio:
               - Escribí el informe completo (formato "Resumen final" de la rúbrica, con archivo:línea
                 y el hash corto del commit donde aparece) en el archivo `revision-claude.md`.
               - Abrí un issue con:
                 `gh issue create --title "Revisión automática: <resumen de 5-8 palabras>" --body-file revision-claude.md`
            5. Si sólo hay hallazgos Bajos o ninguno, no abras nada.
            No modifiques código del repo ni hagas commits.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue create:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ruff check:*)"
